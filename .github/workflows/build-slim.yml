name: Build Slim (Multi-Platform)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version (e.g., 1.13.0-beta.4). Leave empty to use 'Mode'."
        required: false
        type: string
      mode:
        description: "Build Mode (Ignore if Version set)"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - stable
          - all
      platform:
        description: "Target Platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - windows
          - macos
          - linux

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# SLIM BUILD CONFIGURATION
# ============================================================================
env:
  SLIM_TAGS: "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"
  SLIM_TAGS_NAIVE: "with_gvisor,with_quic,with_utls,with_clash_api,with_naive_outbound,badlinkname,tfogo_checklinkname0"

jobs:
  strategy_matrix:
    name: Determine Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate Version Matrix
        id: generate
        run: |
          set -euo pipefail
          
          # Initialize lists
          VERSIONS_JSON="[]"
          
          add_version() {
            local v=$1
            local t=$2
            local p=$3
            # Use jq to append object to array
            VERSIONS_JSON=$(echo "$VERSIONS_JSON" | jq --arg v "$v" --arg t "$t" --argjson p "$p" \
              '. + [{"version": $v, "tag": $t, "prerelease": $p}]')
          }

          if [ -n "${{ inputs.version }}" ]; then
             # Manual Version
             VER="${{ inputs.version }}"
             TAG="v${VER}"
             # Guess prerelease based on hyphen
             if [[ "$VER" == *"-"* ]]; then PRE=true; else PRE=false; fi
             add_version "$VER" "$TAG" "$PRE"
             echo "Mode: Manual ($VER)"
          else
             # Fetch from Upstream
             echo "Fetching releases from SagerNet/sing-box..."
             RELEASES_JSON=$(curl -s "https://api.github.com/repos/SagerNet/sing-box/releases")
             
             LATEST_BETA=$(echo "$RELEASES_JSON" | jq -r '[.[] | select(.prerelease == true)] | .[0] | .tag_name')
             LATEST_STABLE=$(echo "$RELEASES_JSON" | jq -r '[.[] | select(.prerelease == false)] | .[0] | .tag_name')
             
             MODE="${{ inputs.mode }}"
             
             if [[ "$MODE" == "beta" || "$MODE" == "all" ]]; then
                if [ -n "$LATEST_BETA" ] && [ "$LATEST_BETA" != "null" ]; then
                  VER=$(echo "$LATEST_BETA" | sed 's/^v//')
                  add_version "$VER" "$LATEST_BETA" true
                  echo "Found Beta: $LATEST_BETA"
                fi
             fi
             
             if [[ "$MODE" == "stable" || "$MODE" == "all" ]]; then
                if [ -n "$LATEST_STABLE" ] && [ "$LATEST_STABLE" != "null" ]; then
                  VER=$(echo "$LATEST_STABLE" | sed 's/^v//')
                  add_version "$VER" "$LATEST_STABLE" false
                  echo "Found Stable: $LATEST_STABLE"
                fi
             fi
          fi
          
          echo "Generated Matrix:"
          echo "$VERSIONS_JSON" | jq .
          
          # Set output (compress json to one line)
          echo "matrix=$(echo "$VERSIONS_JSON" | jq -c .)" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # ANDROID BUILD
  # ============================================================================
  build_android:
    name: Android (${{ matrix.config.version }})
    runs-on: ubuntu-latest
    needs: strategy_matrix
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with: { path: custom }

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ matrix.config.tag }}
          fetch-depth: 0
          submodules: 'recursive'
          path: sing-box

      - name: Apply slim modifications
        run: |
          cp custom/include/registry.go sing-box/include/registry.go
          cp custom/include/quic.go sing-box/include/quic.go
          cp custom/include/quic_stub.go sing-box/include/quic_stub.go

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: ^1.25.5 }

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r28, local-cache: true }

      - name: Setup OpenJDK
        run: sudo apt update && sudo apt install -y openjdk-17-jdk-headless

      - name: Set tag
        working-directory: sing-box
        run: git tag v${{ matrix.config.version }} -f || true

      - name: Build library
        working-directory: sing-box
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          VERSION="${{ matrix.config.version }}"
          TAGS="${{ env.SLIM_TAGS_NAIVE }},with_conntrack"
          LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=${VERSION} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0"
          
          gomobile bind -v -o libbox.aar -target android/arm64 -androidapi 23 \
            -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false \
            -ldflags "${LDFLAGS}" -tags "${TAGS}" ./experimental/libbox
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Checkout Android Client
        working-directory: sing-box
        run: |-
          rm -rf clients/android
          git clone -b dev https://github.com/sjnhnp/sing-box-for-android.git clients/android

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-android-slim-${{ hashFiles('sing-box/clients/android/**/*.gradle*') }}

      - name: Update Version Prop
        working-directory: sing-box
        run: |
          VERSION="${{ matrix.config.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH_FULL=$(echo "$VERSION" | cut -d. -f3)
          PATCH=$(echo "$PATCH_FULL" | cut -d- -f1)
          PRERELEASE_NUM=0
          if echo "$VERSION" | grep -q "alpha\|beta\|rc"; then
            PRERELEASE_NUM=$(echo "$VERSION" | grep -oE '[0-9]+$' || echo "0")
          fi
          VERSION_CODE=$((MAJOR * 10000000 + MINOR * 100000 + PATCH * 1000 + PRERELEASE_NUM))
          
          echo "VERSION_CODE=${VERSION_CODE}" > clients/android/version.properties
          echo "VERSION_NAME=${VERSION}" >> clients/android/version.properties

      - name: Setup Keystore
        working-directory: sing-box
        run: |-
          cd clients/android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          cat > local.properties << EOF
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME=${{ secrets.KEY_ALIAS }}
          ALIAS_PASS=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Patch Gradle (Arm64 Only)
        working-directory: sing-box
        run: |-
          cd clients/android/app
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' build.gradle.kts

      - name: Build APK
        working-directory: sing-box
        run: |-
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/
          cp libbox.aar clients/android/app/libs/libbox-legacy.aar
          cd clients/android
          ./gradlew :app:assembleOtherRelease --no-daemon
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Prepare Artifacts
        run: |-
          mkdir -p dist
          find sing-box/clients/android/app/build/outputs/apk/other/release -name "*.apk" -exec cp {} dist/ \;
          
          # Generate version metadata for updater
          VERSION_CODE=$(grep VERSION_CODE sing-box/clients/android/version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME sing-box/clients/android/version.properties | cut -d= -f2)
          cat > dist/SFA-version-metadata.json << EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}"
          }
          EOF
          
          cd dist
          mv *.apk "sing-box-${{ matrix.config.version }}-android-arm64-slim.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Unique name for each matrix version
          name: android-arm64-slim-${{ matrix.config.version }}
          path: dist
          retention-days: 1

  # ============================================================================
  # WINDOWS BUILD
  # ============================================================================
  build_windows:
    name: Windows ${{ matrix.arch }} (${{ matrix.config.version }})
    runs-on: windows-latest
    needs: strategy_matrix
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
        arch: [amd64, arm64]
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with: { path: custom }

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ matrix.config.tag }}
          fetch-depth: 0
          path: sing-box

      - name: Apply slim modifications
        run: |
          Copy-Item custom/include/registry.go sing-box/include/registry.go -Force
          Copy-Item custom/include/quic.go sing-box/include/quic.go -Force
          Copy-Item custom/include/quic_stub.go sing-box/include/quic_stub.go -Force

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: ^1.25.5 }

      - name: Set tag
        working-directory: sing-box
        run: git tag v${{ matrix.config.version }} -f

      - name: Build
        working-directory: sing-box
        run: |
          mkdir -p dist
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          $TAGS = "${{ env.SLIM_TAGS_NAIVE }},with_purego"
          
          go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
            -ldflags "-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ matrix.config.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0" `
            ./cmd/sing-box
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract libcronet.dll
        working-directory: sing-box
        run: |
          $CRONET_GO_VERSION = Get-Content .github/CRONET_GO_VERSION
          $env:CGO_ENABLED = "0"
          go run -v "github.com/sagernet/cronet-go/cmd/build-naive@$CRONET_GO_VERSION" extract-lib --target windows/${{ matrix.arch }} -o dist

      - name: Archive
        working-directory: sing-box
        run: |
          $DIR_NAME = "sing-box-${{ matrix.config.version }}-windows-${{ matrix.arch }}-slim"
          mkdir "dist/$DIR_NAME"
          Copy-Item LICENSE "dist/$DIR_NAME"
          Copy-Item "dist/sing-box.exe" "dist/$DIR_NAME"
          Copy-Item "dist/libcronet.dll" "dist/$DIR_NAME"
          Compress-Archive -Path "dist/$DIR_NAME" -DestinationPath "dist/$DIR_NAME.zip"
          Remove-Item -Recurse "dist/$DIR_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-slim-${{ matrix.config.version }}
          path: sing-box/dist
          retention-days: 1

  # ============================================================================
  # MACOS BUILD
  # ============================================================================
  build_macos:
    name: macOS ${{ matrix.arch }} (${{ matrix.config.version }})
    runs-on: macos-latest
    needs: strategy_matrix
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
        arch: [amd64, arm64]
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with: { path: custom }

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ matrix.config.tag }}
          fetch-depth: 0
          path: sing-box

      - name: Apply slim modifications
        run: |
          cp custom/include/registry.go sing-box/include/registry.go
          cp custom/include/quic.go sing-box/include/quic.go
          cp custom/include/quic_stub.go sing-box/include/quic_stub.go

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: ^1.25.5 }

      - name: Set tag
        working-directory: sing-box
        run: git tag v${{ matrix.config.version }} -f

      - name: Build
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          mkdir -p dist
          TAGS="${{ env.SLIM_TAGS_NAIVE }}"
          
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
            -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ matrix.config.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ matrix.config.version }}-darwin-${{ matrix.arch }}-slim"
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}" sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-slim-${{ matrix.config.version }}
          path: sing-box/dist
          retention-days: 1

  # ============================================================================
  # LINUX BUILD
  # ============================================================================
  build_linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.config.version }})
    runs-on: ubuntu-latest
    needs: strategy_matrix
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
        arch: [amd64, arm64]
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with: { path: custom }

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ matrix.config.tag }}
          fetch-depth: 0
          path: sing-box

      - name: Apply slim modifications
        run: |
          cp custom/include/registry.go sing-box/include/registry.go
          cp custom/include/quic.go sing-box/include/quic.go
          cp custom/include/quic_stub.go sing-box/include/quic_stub.go

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: ^1.25.5 }

      - name: Set tag
        working-directory: sing-box
        run: git tag v${{ matrix.config.version }} -f

      - name: Build
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          mkdir -p dist
          # Use with_purego for NaiveProxy support on Linux
          TAGS="${{ env.SLIM_TAGS_NAIVE }},with_purego"
          
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
            -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ matrix.config.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract libcronet.so
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          CGO_ENABLED=0 go run -v "github.com/sagernet/cronet-go/cmd/build-naive@${CRONET_GO_VERSION}" extract-lib --target linux/${{ matrix.arch }} -o dist

      - name: Archive
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ matrix.config.version }}-linux-${{ matrix.arch }}-slim"
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          # Include libcronet.so for NaiveProxy
          if [ -f libcronet.so ]; then
            cp libcronet.so "${DIR_NAME}"
          fi
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}" sing-box
          [ -f libcronet.so ] && rm libcronet.so || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-slim-${{ matrix.config.version }}
          path: sing-box/dist
          retention-days: 1

  # ============================================================================
  # CREATE RELEASES
  # ============================================================================
  release:
    name: Release ${{ matrix.config.tag }}
    runs-on: ubuntu-latest
    needs: [strategy_matrix, build_android, build_windows, build_macos, build_linux]
    if: always() && needs.strategy_matrix.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-slim-${{ matrix.config.version }}"
          merge-multiple: true

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          # Move files matching current version to release dir
          find artifacts -type f -name "*${{ matrix.config.version }}*" -exec cp {} release_files/ \; 2>/dev/null || true
          # Also copy the metadata json
          find artifacts -type f -name "SFA-version-metadata.json" -exec cp {} release_files/ \; 2>/dev/null || true
          ls -la release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.config.version }}-slim
          name: sing-box v${{ matrix.config.version }} Slim Build
          body: |
            ## sing-box Slim Build - Multi-Platform Release

            **Based on upstream sing-box ${{ matrix.config.tag }}**
            
            ### 📦 Downloads
            
            | Platform | File |
            |----------|------|
            | Android (arm64) | `sing-box-${{ matrix.config.version }}-android-arm64-slim.apk` |
            | Windows (amd64) | `sing-box-${{ matrix.config.version }}-windows-amd64-slim.zip` |
            | Windows (arm64) | `sing-box-${{ matrix.config.version }}-windows-arm64-slim.zip` |
            | macOS (Intel) | `sing-box-${{ matrix.config.version }}-darwin-amd64-slim.tar.gz` |
            | macOS (Silicon) | `sing-box-${{ matrix.config.version }}-darwin-arm64-slim.tar.gz` |
            | Linux (amd64) | `sing-box-${{ matrix.config.version }}-linux-amd64-slim.tar.gz` |
            | Linux (arm64) | `sing-box-${{ matrix.config.version }}-linux-arm64-slim.tar.gz` |

            ### ✅ Included Protocols
            - VLESS (Reality), VMess, Trojan, Shadowsocks, Hysteria2
            - **NaiveProxy** support:
              - Windows: includes `libcronet.dll`
              - Linux: includes `libcronet.so` (place in same directory as binary)
              - macOS: CGO-built, no external library needed
              - Android: included
            
            ### ❌ Removed
            - Tor, SSH, ShadowTLS, AnyTLS, TUIC, Hysteria v1, WireGuard, Tailscale
            

          draft: false
          prerelease: ${{ matrix.config.prerelease }}
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

