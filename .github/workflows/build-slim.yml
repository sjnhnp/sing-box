name: Build Slim (Multi-Platform)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version (e.g., 1.13.0-beta.4). Leave empty to use 'Mode'."
        required: false
        type: string
      mode:
        description: "Build Mode (Ignore if Version set)"
        required: true
        default: "stable"
        type: choice
        options:
          - alpha
          - beta
          - stable
          - all
      platform:
        description: "Target Platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - windows
          - macos
          - linux
      # ====== Protocol Selection ======
      protocol_mode:
        description: "Protocol Mode (slim/full: ignore checkboxes; custom: use checkboxes)"
        required: true
        default: "slim"
        type: choice
        options:
          - slim # 精简: VLESS/VMess/Trojan/SS/Hy2/Naive (忽略下方选项)
          - full # 完整: 全部协议 (忽略下方选项)
          - custom # 自定义: 根据下方勾选决定
      # ====== Custom Protocol Options (ONLY used when protocol_mode = 'custom') ======
      proto_vless:
        description: "├─ VLESS (Reality support)"
        type: boolean
        default: true
      proto_vmess:
        description: "├─ VMess"
        type: boolean
        default: true
      proto_trojan:
        description: "├─ Trojan"
        type: boolean
        default: true
      proto_shadowsocks:
        description: "├─ Shadowsocks"
        type: boolean
        default: true
      proto_hysteria2:
        description: "├─ Hysteria2"
        type: boolean
        default: true
      proto_naive:
        description: "├─ NaïveProxy"
        type: boolean
        default: true
      proto_hysteria:
        description: "├─ Hysteria (v1)"
        type: boolean
        default: false
      proto_tuic:
        description: "├─ TUIC"
        type: boolean
        default: false
      proto_shadowtls:
        description: "├─ ShadowTLS"
        type: boolean
        default: false
      proto_anytls:
        description: "├─ AnyTLS"
        type: boolean
        default: false
      proto_wireguard:
        description: "├─ WireGuard"
        type: boolean
        default: false
      proto_tailscale:
        description: "├─ Tailscale"
        type: boolean
        default: false
      proto_ssh:
        description: "├─ SSH"
        type: boolean
        default: false
      proto_tor:
        description: "└─ Tor"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# SLIM BUILD CONFIGURATION
# ============================================================================
env:
  SLIM_TAGS: "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"
  SLIM_TAGS_NAIVE: "with_gvisor,with_quic,with_utls,with_clash_api,with_naive_outbound,badlinkname,tfogo_checklinkname0"

jobs:
  strategy_matrix:
    name: Determine Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      build_matrix: ${{ steps.generate.outputs.build_matrix }}
      has_builds: ${{ steps.generate.outputs.has_builds }}
      protocol_mode: ${{ steps.protocols.outputs.protocol_mode }}
      protocols_list: ${{ steps.protocols.outputs.protocols_list }}
      build_tags: ${{ steps.protocols.outputs.build_tags }}
      proto_env: ${{ steps.protocols.outputs.proto_env }}
    steps:
      - name: Generate Version Matrix
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Initialize versions list
          VERSIONS_JSON="[]"

          add_version() {
            local v=$1
            local t=$2
            local p=$3
            VERSIONS_JSON=$(echo "$VERSIONS_JSON" | jq -c --arg v "$v" --arg t "$t" --argjson p "$p" \
              '. + [{"version": $v, "tag": $t, "prerelease": $p}]')
          }

          if [ -n "${{ inputs.version }}" ]; then
             VER="${{ inputs.version }}"
             TAG="v${VER}"
             if [[ "$VER" == *"-"* ]]; then PRE=true; else PRE=false; fi
             add_version "$VER" "$TAG" "$PRE"
          else
             echo "Fetching releases from SagerNet/sing-box..."
             RELEASES_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/SagerNet/sing-box/releases")
             
             # Check if RELEASES_JSON is an array
             if ! echo "$RELEASES_JSON" | jq -e 'type == "array"' > /dev/null; then
                echo "Error: GitHub API did not return an array. Response was:"
                echo "$RELEASES_JSON" | head -n 20
                exit 1
             fi

             # Find latest alpha (tag contains -alpha)
             LATEST_ALPHA=$(echo "$RELEASES_JSON" | jq -r '.[] | select(type=="object") | .tag_name | select(type=="string" and contains("-alpha"))' | head -n 1 || echo "")
             
             # Find latest beta (tag contains -beta but not -alpha)
             LATEST_BETA=$(echo "$RELEASES_JSON" | jq -r '.[] | select(type=="object") | .tag_name | select(type=="string" and contains("-beta") and (contains("-alpha") | not))' | head -n 1 || echo "")
             
             # Find latest stable (no prerelease suffix)
             LATEST_STABLE=$(echo "$RELEASES_JSON" | jq -r '.[] | select(type=="object") | .tag_name | select(type=="string" and (test("-alpha|-beta|-rc") | not))' | head -n 1 || echo "")
             
             echo "Latest Alpha: $LATEST_ALPHA"
             echo "Latest Beta: $LATEST_BETA"
             echo "Latest Stable: $LATEST_STABLE"
             
             MODE="${{ inputs.mode }}"
             if [[ "$MODE" == "alpha" || "$MODE" == "all" ]]; then
                if [ -n "$LATEST_ALPHA" ] && [ "$LATEST_ALPHA" != "null" ]; then
                  VER=$(echo "$LATEST_ALPHA" | sed 's/^v//')
                  add_version "$VER" "$LATEST_ALPHA" true
                fi
             fi
             if [[ "$MODE" == "beta" || "$MODE" == "all" ]]; then
                if [ -n "$LATEST_BETA" ] && [ "$LATEST_BETA" != "null" ]; then
                  VER=$(echo "$LATEST_BETA" | sed 's/^v//')
                  add_version "$VER" "$LATEST_BETA" true
                fi
             fi
             if [[ "$MODE" == "stable" || "$MODE" == "all" ]]; then
                if [ -n "$LATEST_STABLE" ] && [ "$LATEST_STABLE" != "null" ]; then
                  VER=$(echo "$LATEST_STABLE" | sed 's/^v//')
                  add_version "$VER" "$LATEST_STABLE" false
                fi
             fi
          fi

          # Generate unified build matrix
          BUILD_MATRIX="[]"
          PLATFORM="${{ inputs.platform }}"

          # Android
          if [[ "$PLATFORM" == "all" || "$PLATFORM" == "android" ]]; then
            ANDROID_PART=$(echo "$VERSIONS_JSON" | jq -c '[.[] | {type: "android", platform: "Android", arch: "arm64", runner: "ubuntu-latest", os: "android", version: .version, tag: .tag, prerelease: .prerelease}]')
            BUILD_MATRIX=$(echo "$BUILD_MATRIX" | jq -c --argjson p "$ANDROID_PART" '. + $p')
          fi

          # Windows
          if [[ "$PLATFORM" == "all" || "$PLATFORM" == "windows" ]]; then
            WINDOWS_PART=$(echo "$VERSIONS_JSON" | jq -c '[.[] as $v | ["amd64", "arm64"] | .[] as $arch | {type: "desktop", platform: "Windows", arch: $arch, runner: "windows-latest", os: "windows", version: $v.version, tag: $v.tag, prerelease: $v.prerelease}]')
            BUILD_MATRIX=$(echo "$BUILD_MATRIX" | jq -c --argjson p "$WINDOWS_PART" '. + $p')
          fi

          # macOS
          if [[ "$PLATFORM" == "all" || "$PLATFORM" == "macos" ]]; then
            MACOS_PART=$(echo "$VERSIONS_JSON" | jq -c '[.[] as $v | ["amd64", "arm64"] | .[] as $arch | {type: "desktop", platform: "macOS", arch: $arch, runner: "macos-latest", os: "darwin", version: $v.version, tag: $v.tag, prerelease: $v.prerelease}]')
            BUILD_MATRIX=$(echo "$BUILD_MATRIX" | jq -c --argjson p "$MACOS_PART" '. + $p')
          fi

          # Linux
          if [[ "$PLATFORM" == "all" || "$PLATFORM" == "linux" ]]; then
            LINUX_PART=$(echo "$VERSIONS_JSON" | jq -c '[.[] as $v | ["amd64", "arm64"] | .[] as $arch | {type: "desktop", platform: "Linux", arch: $arch, runner: "ubuntu-latest", os: "linux", version: $v.version, tag: $v.tag, prerelease: $v.prerelease}]')
            BUILD_MATRIX=$(echo "$BUILD_MATRIX" | jq -c --argjson p "$LINUX_PART" '. + $p')
          fi

          HAS_BUILDS="false"
          if [[ "$BUILD_MATRIX" != "[]" ]]; then
            HAS_BUILDS="true"
          fi

          {
            echo "build_matrix<<EOF"
            echo "$BUILD_MATRIX"
            echo "EOF"
            echo "matrix<<EOF"
            echo "$VERSIONS_JSON"
            echo "EOF"
            echo "has_builds=$HAS_BUILDS"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Protocol Config
        id: protocols
        run: |
          set -euo pipefail

          PROTOCOL_MODE="${{ inputs.protocol_mode }}"
          echo "Protocol Mode: $PROTOCOL_MODE"

          # Define protocol states based on mode
          case "$PROTOCOL_MODE" in
            slim)
              # Slim mode - current default protocols
              PROTO_VLESS=true
              PROTO_VMESS=true
              PROTO_TROJAN=true
              PROTO_SHADOWSOCKS=true
              PROTO_HYSTERIA2=true
              PROTO_NAIVE=true
              PROTO_HYSTERIA=false
              PROTO_TUIC=false
              PROTO_SHADOWTLS=false
              PROTO_ANYTLS=false
              PROTO_WIREGUARD=false
              PROTO_TAILSCALE=false
              PROTO_SSH=false
              PROTO_TOR=false
              ;;
            full)
              # Full mode - all protocols enabled
              PROTO_VLESS=true
              PROTO_VMESS=true
              PROTO_TROJAN=true
              PROTO_SHADOWSOCKS=true
              PROTO_HYSTERIA2=true
              PROTO_NAIVE=true
              PROTO_HYSTERIA=true
              PROTO_TUIC=true
              PROTO_SHADOWTLS=true
              PROTO_ANYTLS=true
              PROTO_WIREGUARD=true
              PROTO_TAILSCALE=true
              PROTO_SSH=true
              PROTO_TOR=true
              ;;
            custom)
              # Custom mode - use user selections
              PROTO_VLESS=${{ inputs.proto_vless }}
              PROTO_VMESS=${{ inputs.proto_vmess }}
              PROTO_TROJAN=${{ inputs.proto_trojan }}
              PROTO_SHADOWSOCKS=${{ inputs.proto_shadowsocks }}
              PROTO_HYSTERIA2=${{ inputs.proto_hysteria2 }}
              PROTO_NAIVE=${{ inputs.proto_naive }}
              PROTO_HYSTERIA=${{ inputs.proto_hysteria }}
              PROTO_TUIC=${{ inputs.proto_tuic }}
              PROTO_SHADOWTLS=${{ inputs.proto_shadowtls }}
              PROTO_ANYTLS=${{ inputs.proto_anytls }}
              PROTO_WIREGUARD=${{ inputs.proto_wireguard }}
              PROTO_TAILSCALE=${{ inputs.proto_tailscale }}
              PROTO_SSH=${{ inputs.proto_ssh }}
              PROTO_TOR=${{ inputs.proto_tor }}
              ;;
          esac

          # Generate protocol list for release notes
          PROTOCOLS="Direct, Block, DNS, Socks, HTTP, Mixed, Selector, URLTest"
          [[ "$PROTO_VLESS" == "true" ]] && PROTOCOLS="$PROTOCOLS, VLESS"
          [[ "$PROTO_VMESS" == "true" ]] && PROTOCOLS="$PROTOCOLS, VMess"
          [[ "$PROTO_TROJAN" == "true" ]] && PROTOCOLS="$PROTOCOLS, Trojan"
          [[ "$PROTO_SHADOWSOCKS" == "true" ]] && PROTOCOLS="$PROTOCOLS, Shadowsocks"
          [[ "$PROTO_HYSTERIA2" == "true" ]] && PROTOCOLS="$PROTOCOLS, Hysteria2"
          [[ "$PROTO_NAIVE" == "true" ]] && PROTOCOLS="$PROTOCOLS, NaïveProxy"
          [[ "$PROTO_HYSTERIA" == "true" ]] && PROTOCOLS="$PROTOCOLS, Hysteria"
          [[ "$PROTO_TUIC" == "true" ]] && PROTOCOLS="$PROTOCOLS, TUIC"
          [[ "$PROTO_SHADOWTLS" == "true" ]] && PROTOCOLS="$PROTOCOLS, ShadowTLS"
          [[ "$PROTO_ANYTLS" == "true" ]] && PROTOCOLS="$PROTOCOLS, AnyTLS"
          [[ "$PROTO_WIREGUARD" == "true" ]] && PROTOCOLS="$PROTOCOLS, WireGuard"
          [[ "$PROTO_TAILSCALE" == "true" ]] && PROTOCOLS="$PROTOCOLS, Tailscale"
          [[ "$PROTO_SSH" == "true" ]] && PROTOCOLS="$PROTOCOLS, SSH"
          [[ "$PROTO_TOR" == "true" ]] && PROTOCOLS="$PROTOCOLS, Tor"

          echo "Included protocols: $PROTOCOLS"

          # Generate build tags
          BUILD_TAGS="with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"
          [[ "$PROTO_NAIVE" == "true" ]] && BUILD_TAGS="$BUILD_TAGS,with_naive_outbound"
          [[ "$PROTO_WIREGUARD" == "true" ]] && BUILD_TAGS="$BUILD_TAGS,with_wireguard"
          [[ "$PROTO_TAILSCALE" == "true" ]] && BUILD_TAGS="$BUILD_TAGS,with_tailscale"
          [[ "$PROTO_TOR" == "true" ]] && BUILD_TAGS="$BUILD_TAGS,with_embedded_tor"

          echo "Build tags: $BUILD_TAGS"

          # Generate environment variables JSON for build jobs
          PROTO_ENV=$(cat <<EOF
          {
            "PROTO_VLESS": "$PROTO_VLESS",
            "PROTO_VMESS": "$PROTO_VMESS",
            "PROTO_TROJAN": "$PROTO_TROJAN",
            "PROTO_SHADOWSOCKS": "$PROTO_SHADOWSOCKS",
            "PROTO_HYSTERIA2": "$PROTO_HYSTERIA2",
            "PROTO_NAIVE": "$PROTO_NAIVE",
            "PROTO_HYSTERIA": "$PROTO_HYSTERIA",
            "PROTO_TUIC": "$PROTO_TUIC",
            "PROTO_SHADOWTLS": "$PROTO_SHADOWTLS",
            "PROTO_ANYTLS": "$PROTO_ANYTLS",
            "PROTO_WIREGUARD": "$PROTO_WIREGUARD",
            "PROTO_TAILSCALE": "$PROTO_TAILSCALE",
            "PROTO_SSH": "$PROTO_SSH",
            "PROTO_TOR": "$PROTO_TOR"
          }
          EOF
          )

          {
            echo "protocol_mode=$PROTOCOL_MODE"
            echo "protocols_list=$PROTOCOLS"
            echo "build_tags=$BUILD_TAGS"
            echo "proto_env<<EOF"
            echo "$PROTO_ENV" | jq -c .
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
  # ============================================================================
  # ANDROID BUILD
  # ============================================================================
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }} (${{ matrix.version }})
    runs-on: ${{ matrix.runner }}
    needs: strategy_matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.strategy_matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with:
          path: custom
          ref: ${{ github.ref }}

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ matrix.tag }}
          fetch-depth: 0
          submodules: ${{ matrix.type == 'android' && 'recursive' || 'false' }}
          path: sing-box

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          check-latest: false
          cache-dependency-path: sing-box/go.sum

      - name: Apply protocol modifications (Unix)
        if: matrix.os != 'windows'
        run: |
          PROTOCOL_MODE="${{ needs.strategy_matrix.outputs.protocol_mode }}"
          echo "Protocol mode: $PROTOCOL_MODE"
          case "$PROTOCOL_MODE" in
            slim)
              echo "Generating slim registry files..."
              export PROTO_VLESS=true
              export PROTO_VMESS=true
              export PROTO_TROJAN=true
              export PROTO_SHADOWSOCKS=true
              export PROTO_HYSTERIA2=true
              export PROTO_NAIVE=true
              export PROTO_HYSTERIA=false
              export PROTO_TUIC=false
              export PROTO_SHADOWTLS=false
              export PROTO_ANYTLS=false
              export PROTO_WIREGUARD=false
              export PROTO_TAILSCALE=false
              export PROTO_SSH=false
              export PROTO_TOR=false
              echo "Syncing necessary Go packages from custom..."
              for dir in include experimental route option adapter constant common protocol service transport dns log daemon; do
                if [ -d "custom/$dir" ]; then
                  rm -rf "sing-box/$dir"
                  mkdir -p "sing-box/$dir"
                  cp -r "custom/$dir"/* "sing-box/$dir/"
                fi
              done
              cp custom/go.mod sing-box/go.mod || true
              cp custom/go.sum sing-box/go.sum || true
              cp custom/box.go sing-box/box.go || true
              export OUTPUT_DIR="sing-box/include"
              chmod +x custom/.github/scripts/generate-registry.sh
              bash custom/.github/scripts/generate-registry.sh
              cd sing-box && go mod tidy && cd ..
              ;;
            full)
              echo "Using upstream registry files (full mode)..."
              if [ "${{ matrix.type }}" = "android" ]; then
                echo "Android target: Syncing necessary Go packages from custom for custom APIs..."
                for dir in include experimental route option adapter constant common protocol service transport dns log daemon; do
                  if [ -d "custom/$dir" ]; then
                    rm -rf "sing-box/$dir"
                    mkdir -p "sing-box/$dir"
                    cp -r "custom/$dir"/* "sing-box/$dir/"
                  fi
                done
                cp custom/go.mod sing-box/go.mod || true
                cp custom/go.sum sing-box/go.sum || true
                cp custom/box.go sing-box/box.go || true
              fi
              ;;
            custom)
              echo "Generating custom registry files..."
              echo "Syncing necessary Go packages from custom..."
              for dir in include experimental route option adapter constant common protocol service transport dns log daemon; do
                if [ -d "custom/$dir" ]; then
                  rm -rf "sing-box/$dir"
                  mkdir -p "sing-box/$dir"
                  cp -r "custom/$dir"/* "sing-box/$dir/"
                fi
              done
              cp custom/go.mod sing-box/go.mod || true
              cp custom/go.sum sing-box/go.sum || true
              cp custom/box.go sing-box/box.go || true
              cd sing-box && go mod tidy && cd ..
              PROTO_ENV='${{ needs.strategy_matrix.outputs.proto_env }}'
              export PROTO_VLESS=$(echo "$PROTO_ENV" | jq -r '.PROTO_VLESS')
              export PROTO_VMESS=$(echo "$PROTO_ENV" | jq -r '.PROTO_VMESS')
              export PROTO_TROJAN=$(echo "$PROTO_ENV" | jq -r '.PROTO_TROJAN')
              export PROTO_SHADOWSOCKS=$(echo "$PROTO_ENV" | jq -r '.PROTO_SHADOWSOCKS')
              export PROTO_HYSTERIA2=$(echo "$PROTO_ENV" | jq -r '.PROTO_HYSTERIA2')
              export PROTO_NAIVE=$(echo "$PROTO_ENV" | jq -r '.PROTO_NAIVE')
              export PROTO_HYSTERIA=$(echo "$PROTO_ENV" | jq -r '.PROTO_HYSTERIA')
              export PROTO_TUIC=$(echo "$PROTO_ENV" | jq -r '.PROTO_TUIC')
              export PROTO_SHADOWTLS=$(echo "$PROTO_ENV" | jq -r '.PROTO_SHADOWTLS')
              export PROTO_ANYTLS=$(echo "$PROTO_ENV" | jq -r '.PROTO_ANYTLS')
              export PROTO_WIREGUARD=$(echo "$PROTO_ENV" | jq -r '.PROTO_WIREGUARD')
              export PROTO_TAILSCALE=$(echo "$PROTO_ENV" | jq -r '.PROTO_TAILSCALE')
              export PROTO_SSH=$(echo "$PROTO_ENV" | jq -r '.PROTO_SSH')
              export PROTO_TOR=$(echo "$PROTO_ENV" | jq -r '.PROTO_TOR')
              export OUTPUT_DIR="sing-box/include"
              chmod +x custom/.github/scripts/generate-registry.sh
              bash custom/.github/scripts/generate-registry.sh
              ;;
          esac

      - name: Apply protocol modifications (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $PROTOCOL_MODE = "${{ needs.strategy_matrix.outputs.protocol_mode }}"
          switch ($PROTOCOL_MODE) {
            "slim" {
              echo "Generating slim registry files..."
              $env:PROTO_VLESS="true"
              $env:PROTO_VMESS="true"
              $env:PROTO_TROJAN="true"
              $env:PROTO_SHADOWSOCKS="true"
              $env:PROTO_HYSTERIA2="true"
              $env:PROTO_NAIVE="true"
              $env:PROTO_HYSTERIA="false"
              $env:PROTO_TUIC="false"
              $env:PROTO_SHADOWTLS="false"
              $env:PROTO_ANYTLS="false"
              $env:PROTO_WIREGUARD="false"
              $env:PROTO_TAILSCALE="false"
              $env:PROTO_SSH="false"
              $env:PROTO_TOR="false"
              $dirs = @("include", "experimental", "route", "option", "adapter", "constant", "common", "protocol", "service", "transport", "dns", "log", "daemon")
              foreach ($dir in $dirs) {
                if (Test-Path "custom/$dir") {
                  if (Test-Path "sing-box/$dir") { Remove-Item -Recurse -Force "sing-box/$dir" }
                  New-Item -ItemType Directory -Force -Path "sing-box/$dir"
                  Copy-Item -Recurse "custom/$dir/*" "sing-box/$dir/" -Force
                }
              }
              if (Test-Path "custom/go.mod") { Copy-Item "custom/go.mod" "sing-box/go.mod" -Force }
              if (Test-Path "custom/go.sum") { Copy-Item "custom/go.sum" "sing-box/go.sum" -Force }
              if (Test-Path "custom/box.go") { Copy-Item "custom/box.go" "sing-box/box.go" -Force }
              $env:OUTPUT_DIR="sing-box/include"
              bash custom/.github/scripts/generate-registry.sh
              Set-Location sing-box
              go mod tidy
              Set-Location ..
            }
            "full" {}
            "custom" {
              Copy-Item custom/include/registry.go sing-box/include/registry.go -Force
              Copy-Item custom/include/quic.go sing-box/include/quic.go -Force
              Copy-Item custom/include/quic_stub.go sing-box/include/quic_stub.go -Force
              $dirs = @("include", "experimental", "route", "option", "adapter", "constant", "common", "protocol", "service", "transport", "dns", "log", "daemon")
              foreach ($dir in $dirs) {
                if (Test-Path "custom/$dir") {
                  if (Test-Path "sing-box/$dir") { Remove-Item -Recurse -Force "sing-box/$dir" }
                  New-Item -ItemType Directory -Force -Path "sing-box/$dir"
                  Copy-Item -Recurse "custom/$dir/*" "sing-box/$dir/" -Force
                }
              }
              if (Test-Path "custom/go.mod") { Copy-Item "custom/go.mod" "sing-box/go.mod" -Force }
              if (Test-Path "custom/go.sum") { Copy-Item "custom/go.sum" "sing-box/go.sum" -Force }
              if (Test-Path "custom/box.go") { Copy-Item "custom/box.go" "sing-box/box.go" -Force }
              Set-Location sing-box
              go mod tidy
              Set-Location ..
            }
          }

      - name: Setup Android NDK
        if: matrix.type == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r29, local-cache: false }

      - name: Setup Java
        if: matrix.type == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set tag
        working-directory: sing-box
        shell: bash
        run: git tag v${{ matrix.version }} -f || true

      - name: Build Android Library
        if: matrix.type == 'android'
        working-directory: sing-box
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          VERSION="${{ matrix.version }}"
          TAGS="${{ needs.strategy_matrix.outputs.build_tags }},with_conntrack"
          LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=${VERSION} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0"
          gomobile bind -v -o libbox.aar -target android/arm64 -androidapi 23 \
            -javapkg=io.nekohasekai -libname=libbox -trimpath -buildvcs=false \
            -ldflags "${LDFLAGS}" -tags "${TAGS}" ./experimental/libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GODEBUG: multipathtcp=0

      - name: Build Desktop (Windows)
        if: matrix.os == 'windows'
        working-directory: sing-box
        run: |
          mkdir -p dist
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          $TAGS = "${{ needs.strategy_matrix.outputs.build_tags }},with_purego"
          go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
            -ldflags "-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ matrix.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0" `
            ./cmd/sing-box

      - name: Build Desktop (macOS)
        if: matrix.os == 'darwin'
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          mkdir -p dist
          TAGS="${{ needs.strategy_matrix.outputs.build_tags }}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.arch }} \
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
            -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ matrix.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
            ./cmd/sing-box

      - name: Build Desktop (Linux)
        if: matrix.os == 'linux'
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          mkdir -p dist
          TAGS="${{ needs.strategy_matrix.outputs.build_tags }},with_purego"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
            -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ matrix.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
            ./cmd/sing-box

      - name: Extract libcronet (Windows)
        if: matrix.os == 'windows'
        working-directory: sing-box
        run: |
          $CRONET_GO_VERSION = Get-Content ../custom/.github/CRONET_GO_VERSION
          $env:CGO_ENABLED = "0"
          go run -v "github.com/sagernet/cronet-go/cmd/build-naive@$CRONET_GO_VERSION" extract-lib --target windows/${{ matrix.arch }} -o dist

      - name: Extract libcronet (Linux)
        if: matrix.os == 'linux'
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat ../custom/.github/CRONET_GO_VERSION)
          CGO_ENABLED=0 go run -v "github.com/sagernet/cronet-go/cmd/build-naive@${CRONET_GO_VERSION}" extract-lib --target linux/${{ matrix.arch }} -o dist

      - name: Android - Checkout Client
        if: matrix.type == 'android'
        working-directory: sing-box
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          rm -rf clients/android
          for i in 1 2 3; do
            git clone --recurse-submodules -b dev https://x-access-token:${GITHUB_TOKEN}@github.com/sjnhnp/sing-box-for-android.git clients/android && break
            echo "Clone attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Android - Gradle cache
        if: matrix.type == 'android'
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-android-slim-${{ hashFiles('sing-box/clients/android/**/*.gradle*') }}

      - name: Android - Update Version Prop
        if: matrix.type == 'android'
        working-directory: sing-box
        run: |
          VERSION="${{ matrix.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH_FULL=$(echo "$VERSION" | cut -d. -f3)
          PATCH=$(echo "$PATCH_FULL" | cut -d- -f1)
          PRERELEASE_NUM=999
          if echo "$VERSION" | grep -q "alpha"; then
            PRERELEASE_NUM=$(echo "$VERSION" | grep -oE '[0-9]+$' || echo "0")
            PRERELEASE_NUM=$((PRERELEASE_NUM + 100))
          elif echo "$VERSION" | grep -q "beta"; then
            PRERELEASE_NUM=$(echo "$VERSION" | grep -oE '[0-9]+$' || echo "0")
            PRERELEASE_NUM=$((PRERELEASE_NUM + 400))
          elif echo "$VERSION" | grep -q "rc"; then
            PRERELEASE_NUM=$(echo "$VERSION" | grep -oE '[0-9]+$' || echo "0")
            PRERELEASE_NUM=$((PRERELEASE_NUM + 700))
          fi
          VERSION_CODE=$((MAJOR * 10000000 + MINOR * 100000 + PATCH * 1000 + PRERELEASE_NUM))
          echo "VERSION_CODE=${VERSION_CODE}" > clients/android/version.properties
          echo "VERSION_NAME=${VERSION}" >> clients/android/version.properties

      - name: Android - Setup Keystore
        if: matrix.type == 'android'
        working-directory: sing-box
        run: |-
          cd clients/android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          cat > local.properties << EOF
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME=${{ secrets.KEY_ALIAS }}
          ALIAS_PASS=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Android - Patch Gradle (Arm64 Only)
        if: matrix.type == 'android'
        working-directory: sing-box
        run: |-
          cd clients/android/app
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' build.gradle.kts

      - name: Android - Build APK
        if: matrix.type == 'android'
        working-directory: sing-box
        run: |-
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/
          cp libbox.aar clients/android/app/libs/libbox-legacy.aar
          cd clients/android
          ./gradlew :app:assembleOtherRelease --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Android - Prepare Artifacts
        if: matrix.type == 'android'
        run: |-
          mkdir -p dist
          find sing-box/clients/android/app/build/outputs/apk/other/release -name "*.apk" -exec cp {} dist/ \;
          VERSION_CODE=$(grep VERSION_CODE sing-box/clients/android/version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME sing-box/clients/android/version.properties | cut -d= -f2)
          cat > dist/SFA-version-metadata.json << EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}"
          }
          EOF
          cd dist
          PROTOCOL_MODE="${{ needs.strategy_matrix.outputs.protocol_mode }}"
          mv *.apk "sing-box-${{ matrix.version }}-android-arm64-${PROTOCOL_MODE}.apk"

      - name: Archive (Windows)
        if: matrix.os == 'windows'
        working-directory: sing-box
        run: |
          $PROTOCOL_MODE = "${{ needs.strategy_matrix.outputs.protocol_mode }}"
          $DIR_NAME = "sing-box-${{ matrix.version }}-windows-${{ matrix.arch }}-$PROTOCOL_MODE"
          mkdir "../dist/$DIR_NAME"
          Copy-Item LICENSE "../dist/$DIR_NAME"
          Copy-Item "dist/sing-box.exe" "../dist/$DIR_NAME"
          Copy-Item "dist/libcronet.dll" "../dist/$DIR_NAME"
          Compress-Archive -Path "../dist/$DIR_NAME" -DestinationPath "../dist/$DIR_NAME.zip"
          Remove-Item -Recurse "../dist/$DIR_NAME"

      - name: Archive (macOS)
        if: matrix.os == 'darwin'
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          PROTOCOL_MODE="${{ needs.strategy_matrix.outputs.protocol_mode }}"
          DIR_NAME="sing-box-${{ matrix.version }}-darwin-${{ matrix.arch }}-${PROTOCOL_MODE}"
          mkdir -p "../dist/${DIR_NAME}"
          cp LICENSE "../dist/${DIR_NAME}"
          cp dist/sing-box "../dist/${DIR_NAME}"
          cd ../dist
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -rf "${DIR_NAME}"

      - name: Archive (Linux)
        if: matrix.os == 'linux'
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          PROTOCOL_MODE="${{ needs.strategy_matrix.outputs.protocol_mode }}"
          DIR_NAME="sing-box-${{ matrix.version }}-linux-${{ matrix.arch }}-${PROTOCOL_MODE}"
          mkdir -p "../dist/${DIR_NAME}"
          cp LICENSE "../dist/${DIR_NAME}"
          cp dist/sing-box "../dist/${DIR_NAME}"
          [ -f dist/libcronet.so ] && cp dist/libcronet.so "../dist/${DIR_NAME}" || true
          cd ../dist
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -rf "${DIR_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}-${{ needs.strategy_matrix.outputs.protocol_mode }}-${{ matrix.version }}
          path: dist/*
          if-no-files-found: ignore
          retention-days: 1

  # ============================================================================
  # CREATE RELEASES
  # ============================================================================
  release:
    name: Release ${{ matrix.config.tag }}
    runs-on: ubuntu-latest
    needs: [strategy_matrix, build]
    if: >-
      always() &&
      needs.strategy_matrix.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-${{ needs.strategy_matrix.outputs.protocol_mode }}-${{ matrix.config.version }}"
          merge-multiple: true

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          # Move files matching current version to release dir
          find artifacts -type f -name "*${{ matrix.config.version }}*" -exec cp {} release_files/ \; 2>/dev/null || true
          # Also copy the metadata json
          find artifacts -type f -name "SFA-version-metadata.json" -exec cp {} release_files/ \; 2>/dev/null || true
          ls -la release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.config.version }}-${{ needs.strategy_matrix.outputs.protocol_mode }}
          name: sing-box v${{ matrix.config.version }} (${{ needs.strategy_matrix.outputs.protocol_mode }} mode)
          body: |
            ## sing-box Build - Multi-Platform Release

            **Based on upstream sing-box ${{ matrix.config.tag }}**

            **Protocol Mode: `${{ needs.strategy_matrix.outputs.protocol_mode }}`**

            ### 📦 Downloads

            | Platform | File |
            |----------|------|
            | Android (arm64) | `sing-box-${{ matrix.config.version }}-android-arm64-${{ needs.strategy_matrix.outputs.protocol_mode }}.apk` |
            | Windows (amd64) | `sing-box-${{ matrix.config.version }}-windows-amd64-${{ needs.strategy_matrix.outputs.protocol_mode }}.zip` |
            | Windows (arm64) | `sing-box-${{ matrix.config.version }}-windows-arm64-${{ needs.strategy_matrix.outputs.protocol_mode }}.zip` |
            | macOS (Intel) | `sing-box-${{ matrix.config.version }}-darwin-amd64-${{ needs.strategy_matrix.outputs.protocol_mode }}.tar.gz` |
            | macOS (Silicon) | `sing-box-${{ matrix.config.version }}-darwin-arm64-${{ needs.strategy_matrix.outputs.protocol_mode }}.tar.gz` |
            | Linux (amd64) | `sing-box-${{ matrix.config.version }}-linux-amd64-${{ needs.strategy_matrix.outputs.protocol_mode }}.tar.gz` |
            | Linux (arm64) | `sing-box-${{ matrix.config.version }}-linux-arm64-${{ needs.strategy_matrix.outputs.protocol_mode }}.tar.gz` |

            ### ✅ Included Protocols

            ${{ needs.strategy_matrix.outputs.protocols_list }}

            **NaïveProxy support** (if enabled):
            - Windows: includes `libcronet.dll`
            - Linux: includes `libcronet.so` (place in same directory as binary)
            - macOS: CGO-built, no external library needed
            - Android: included

            ### 📋 Build Tags
            ```
            ${{ needs.strategy_matrix.outputs.build_tags }}
            ```

          draft: false
          prerelease: ${{ matrix.config.prerelease }}
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
