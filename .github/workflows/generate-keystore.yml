name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore sfa-release.keystore \
            -alias sfa-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass SfaRelease2024 \
            -keypass SfaRelease2024 \
            -dname "CN=SingBoxForAndroid, OU=Dev, O=SFA, L=Beijing, ST=Beijing, C=CN"
          
          echo ""
          echo "=========================================="
          echo "Add the following secrets to your repository:"
          echo "Settings -> Secrets and variables -> Actions -> New repository secret"
          echo "=========================================="
          echo ""
          echo "1. KEYSTORE_BASE64 (copy the entire base64 string below):"
          echo "----------------------------------------"
          base64 -w 0 sfa-release.keystore
          echo ""
          echo "----------------------------------------"
          echo ""
          echo "2. KEYSTORE_PASSWORD:"
          echo "   SfaRelease2024"
          echo ""
          echo "3. KEY_ALIAS:"
          echo "   sfa-key"
          echo ""
          echo "4. KEY_PASSWORD:"
          echo "   SfaRelease2024"
          echo ""
          echo "=========================================="
          echo "After adding all 4 secrets, run 'Build Android with Naive' workflow"
          echo "=========================================="
