name: Build Android with Naive

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to build (e.g., 1.13.0-alpha.36). Leave empty to use latest pre-release."
        required: false
        type: string
  schedule:
    # Run daily at 00:00 UTC to check for new pre-releases
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_latest_version:
    name: Get latest sing-box version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - name: Get latest pre-release version from upstream
        id: get_version
        run: |
          set -euo pipefail
          
          if [ -n "${{ inputs.version }}" ]; then
            # Use user-specified version
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            echo "Using user-specified version: ${VERSION}"
          else
            # Get the latest pre-release from SagerNet/sing-box
            echo "Fetching latest pre-release from SagerNet/sing-box..."
            RELEASE_INFO=$(curl -s "https://api.github.com/repos/SagerNet/sing-box/releases" | jq -r '[.[] | select(.prerelease == true)] | .[0]')
            
            if [ "$RELEASE_INFO" == "null" ] || [ -z "$RELEASE_INFO" ]; then
              echo "No pre-release found, falling back to latest release"
              RELEASE_INFO=$(curl -s "https://api.github.com/repos/SagerNet/sing-box/releases/latest")
            fi
            
            TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
            VERSION=$(echo "$TAG" | sed 's/^v//')
            echo "Latest pre-release: ${TAG}"
          fi
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Will build sing-box version: ${VERSION} (tag: ${TAG})"

  build_android_naive:
    name: Build Android APK with Naive (arm64-v8a)
    runs-on: ubuntu-latest
    needs:
      - get_latest_version
    steps:
      - name: Checkout upstream sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ needs.get_latest_version.outputs.tag }}
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true

      - name: Setup OpenJDK
        run: |-
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: Set tag
        run: |-
          git tag v${{ needs.get_latest_version.outputs.version }} -f || true

      - name: Build library (with naive support, slim protocols)
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          # Get current version for ldflags
          VERSION="${{ needs.get_latest_version.outputs.version }}"
          
          # Build ONLY libbox.aar with naive support (SDK 23, arm64 only)
          # Using gomobile directly to skip building unnecessary libbox-legacy.aar
          # This saves ~50% of library build time
          
          # SLIM BUILD: Only includes protocols you use:
          # - vless, vmess, trojan, shadowsocks, hysteria2, naive
          # Removed protocols: tor, ssh, shadowtls, anytls, tuic, hysteria v1
          # Removed features: wireguard, tailscale
          
          TAGS="with_gvisor,with_quic,with_utls,with_naive_outbound,with_clash_api,with_conntrack,badlinkname,tfogo_checklinkname0"
          LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=${VERSION} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0"
          
          gomobile bind -v \
            -o libbox.aar \
            -target android/arm64 \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -ldflags "${LDFLAGS}" \
            -tags "${TAGS}" \
            ./experimental/libbox
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Checkout dev branch for Android client
        run: |-
          cd clients/android
          git fetch origin dev
          git checkout dev

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-android-naive-${{ hashFiles('clients/android/**/*.gradle*') }}

      - name: Update version in Android client
        run: |-
          # Update version.properties with the sing-box version
          VERSION="${{ needs.get_latest_version.outputs.version }}"
          
          # Calculate version code from version string
          # Format: MAJOR * 10000000 + MINOR * 100000 + PATCH * 1000 + ALPHA/BETA number
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH_FULL=$(echo "$VERSION" | cut -d. -f3)
          PATCH=$(echo "$PATCH_FULL" | cut -d- -f1)
          
          # Extract alpha/beta number if present
          PRERELEASE_NUM=0
          if echo "$VERSION" | grep -q "alpha\|beta"; then
            PRERELEASE_NUM=$(echo "$VERSION" | grep -oE '[0-9]+$' || echo "0")
          fi
          
          VERSION_CODE=$((MAJOR * 10000000 + MINOR * 100000 + PATCH * 1000 + PRERELEASE_NUM))
          
          echo "VERSION_CODE=${VERSION_CODE}" > clients/android/version.properties
          echo "VERSION_NAME=${VERSION}" >> clients/android/version.properties
          
          echo "Version properties:"
          cat clients/android/version.properties

      - name: Setup signing keystore
        run: |-
          cd clients/android
          
          # Decode keystore from base64
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          
          # Create local.properties with signing config
          cat > local.properties << EOF
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME=${{ secrets.KEY_ALIAS }}
          ALIAS_PASS=${{ secrets.KEY_PASSWORD }}
          EOF
          
          echo "Signing keystore configured"

      - name: Modify build.gradle.kts for arm64 only
        run: |-
          cd clients/android/app
          # Modify the splits section to only build arm64-v8a
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' build.gradle.kts
          # Disable universal APK (we only want arm64)
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' build.gradle.kts
          
          echo "Modified build.gradle.kts:"
          grep -A5 "splits {" build.gradle.kts

      - name: Build APK (arm64-v8a only with naive)
        run: |-
          mkdir -p clients/android/app/libs
          # Only copy libbox.aar (with naive support, SDK 23)
          cp libbox.aar clients/android/app/libs/
          
          # Create a stub libbox-legacy.aar to satisfy Gradle (even though we won't use it)
          # This is needed because build.gradle.kts references it for otherLegacy flavor
          cp libbox.aar clients/android/app/libs/libbox-legacy.aar
          
          cd clients/android

          # Build OtherRelease variant (non-Play Store, SDK 23+, with naive via libbox.aar)
          ./gradlew :app:assembleOtherRelease --no-daemon
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}


      - name: Prepare upload
        run: |-
          mkdir -p dist

          # Copy APK from other/release (arm64-v8a)
          find clients/android/app/build/outputs/apk/other/release -name "*.apk" -exec cp {} dist/ \;

          # Get version info
          VERSION_CODE=$(grep VERSION_CODE clients/android/version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME clients/android/version.properties | cut -d= -f2)

          # Create version metadata
          cat > dist/version-metadata.json << EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}",
            "naive_support": true,
            "architecture": "arm64-v8a",
            "min_sdk": 23,
            "flavor": "other",
            "upstream_tag": "${{ needs.get_latest_version.outputs.tag }}",
            "source": "SagerNet/sing-box"
          }
          EOF
          cat dist/version-metadata.json

          # Rename APK for clarity
          cd dist
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              mv "$apk" "SFA-${{ needs.get_latest_version.outputs.version }}-arm64-v8a-naive.apk"
              break
            fi
          done

          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a-naive-${{ needs.get_latest_version.outputs.version }}
          path: 'dist'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get_latest_version.outputs.version }}-naive-slim
          name: SFA v${{ needs.get_latest_version.outputs.version }} Slim (Naive)
          body: |
            ## Android APK - Slim Build with NaiveProxy Support

            **Based on upstream sing-box ${{ needs.get_latest_version.outputs.tag }}** from [SagerNet/sing-box](https://github.com/SagerNet/sing-box/releases/tag/${{ needs.get_latest_version.outputs.tag }})

            ### Build Info
            - **Architecture**: arm64-v8a only
            - **NaiveProxy**: ✅ Included (`with_naive_outbound`)
            - **Min SDK**: 23 (Android 6.0+)
            - **Flavor**: other (FOSS/GitHub release)

            ### ✅ Included Protocols
            - VLESS (with Reality support)
            - VMess
            - Trojan
            - Shadowsocks
            - Hysteria2
            - NaiveProxy

            ### ❌ Removed Protocols (to reduce APK size)
            - Tor
            - SSH
            - ShadowTLS
            - AnyTLS
            - TUIC
            - Hysteria v1
            - WireGuard
            - Tailscale

            ### Features
            - gVisor (TUN stack)
            - QUIC
            - uTLS
            - Clash API
            - **NaiveProxy outbound**

            ### Installation
            Download `SFA-${{ needs.get_latest_version.outputs.version }}-arm64-v8a-naive.apk` and install on your Android device (Android 6.0+, arm64 only).

            ### Note
            This is a slim build optimized for specific use cases. If you need WireGuard, Tailscale, or other removed protocols, use the official sing-box release.
          draft: false
          prerelease: true
          files: |
            dist/*.apk
            dist/version-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
